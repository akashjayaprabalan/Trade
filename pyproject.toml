[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opening-range-monitor"
version = "0.1.0"
description = "Opening range stock monitor and backtester for US equities."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pandas_market_calendars>=4.4",
  "plotly>=5.20",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "streamlit>=1.57",
  "yfinance>=0.2.40"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opening-range-monitor = "opening_range_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
